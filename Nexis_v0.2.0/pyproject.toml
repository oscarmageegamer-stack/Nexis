[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexis-security"
version = "0.4.0"
description = "Nexis security intelligence and authorised network auditing framework"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
nexis = "nexis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
